{% extends "layout.html" %}

{% block content %}

<div class="mb-8 flex justify-between items-end">
    <div>
        <h1 class="text-4xl font-bold text-slate-800">💡 Combinações Recomendadas</h1>
        <p class="text-slate-500 mt-2 text-lg">Catálogo inteligente gerado com base no seu guarda-roupa.</p>
    </div>
</div>

<div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
    
    <div class="bg-white rounded-3xl border border-slate-100 shadow-sm p-6 flex flex-col justify-between">
        <div>
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-amber-600 flex items-center gap-2">☀️ Clima Quente</h3>
                <span class="text-xs font-bold bg-amber-50 text-amber-700 px-3 py-1 rounded-full uppercase">Calor</span>
            </div>
            <div id="paginaLookCalor" class="space-y-4">
                <p class="text-slate-400 text-center py-8">Carregando look...</p>
            </div>
        </div>
        <div class="mt-6 pt-4 border-t border-slate-50">
            <button onclick="marcarLookUsado('calor')" class="w-full bg-amber-100 hover:bg-amber-500 hover:text-white text-amber-700 text-sm font-bold py-3 rounded-2xl transition">
                Usar Esta Combinação
            </button>
        </div>
    </div>

    <div class="bg-white rounded-3xl border border-slate-100 shadow-sm p-6 flex flex-col justify-between">
        <div>
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-blue-600 flex items-center gap-2">❄️ Clima Frio</h3>
                <span class="text-xs font-bold bg-blue-50 text-blue-700 px-3 py-1 rounded-full uppercase">Frio</span>
            </div>
            <div id="paginaLookFrio" class="space-y-4">
                <p class="text-slate-400 text-center py-8">Carregando look...</p>
            </div>
        </div>
        <div class="mt-6 pt-4 border-t border-slate-50">
            <button onclick="marcarLookUsado('frio')" class="w-full bg-blue-100 hover:bg-blue-600 hover:text-white text-blue-700 text-sm font-bold py-3 rounded-2xl transition">
                Usar Esta Combinação
            </button>
        </div>
    </div>

    <div class="bg-white rounded-3xl border border-slate-100 shadow-sm p-6 flex flex-col justify-between">
        <div>
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-emerald-600 flex items-center gap-2">🍁 Clima Ameno</h3>
                <span class="text-xs font-bold bg-emerald-50 text-emerald-700 px-3 py-1 rounded-full uppercase">Meia Estação</span>
            </div>
            <div id="paginaLookMeia" class="space-y-4">
                <p class="text-slate-400 text-center py-8">Carregando look...</p>
            </div>
        </div>
        <div class="mt-6 pt-4 border-t border-slate-50">
            <button onclick="marcarLookUsado('meia_estacao')" class="w-full bg-emerald-100 hover:bg-emerald-500 hover:text-white text-emerald-700 text-sm font-bold py-3 rounded-2xl transition">
                Usar Esta Combinação
            </button>
        </div>
    </div>

</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    buscarLooksDetalhados();
});

let cacheLooksNaPagina = {};

async function buscarLooksDetalhados() {
    try {
        const res = await fetch('/api/sugestoes_combinacoes');
        const dados = await res.json();

        cacheLooksNaPagina['calor'] = dados.looks.calor;
        cacheLooksNaPagina['frio'] = dados.looks.frio;
        cacheLooksNaPagina['meia_estacao'] = dados.looks.meia_estacao;

        renderizarPecasNaPagina(dados.looks.calor, 'paginaLookCalor');
        renderizarPecasNaPagina(dados.looks.frio, 'paginaLookFrio');
        renderizarPecasNaPagina(dados.looks.meia_estacao, 'paginaLookMeia');
    } catch (error) {
        console.error("Erro ao carregar combinações:", error);
    }
}

function renderizarPecasNaPagina(produtos, elementId) {
    const container = document.getElementById(elementId);
    if (!produtos || produtos.length === 0) {
        container.innerHTML = `<div class="bg-slate-50 p-6 rounded-2xl text-center border border-dashed border-slate-300"><p class="text-sm text-slate-500 font-medium">Você ainda não tem roupas suficientes cadastradas para gerar esta combinação.</p></div>`;
        return;
    }

    container.innerHTML = '';
    produtos.forEach(peca => {
        let imgSrc = peca.foto;
        if (!imgSrc || imgSrc === 'None') imgSrc = '/static/placeholder-roupa.png';
        if (imgSrc && !imgSrc.startsWith('/') && !imgSrc.startsWith('http')) imgSrc = '/' + imgSrc;

        container.innerHTML += `
            <div class="flex items-center gap-4 bg-slate-50 hover:bg-slate-100 p-3 rounded-2xl border border-slate-100 transition shadow-sm">
                <img src="${imgSrc}" class="w-16 h-16 object-cover rounded-xl bg-white border border-slate-200" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3159/3159614.png'">
                <div class="flex-1 min-w-0">
                    <h4 class="font-bold text-slate-800 text-sm truncate">${peca.nome}</h4>
                    <p class="text-xs text-slate-500 font-medium capitalize mt-0.5">${peca.tipo} • ${peca.cor}</p>
                    <span class="inline-block text-[10px] bg-white text-slate-600 px-2 py-0.5 rounded border border-slate-200 mt-1.5 font-bold uppercase">${peca.ocasiao || 'Geral'}</span>
                </div>
            </div>
        `;
    });
}

async function marcarLookUsado(climaId) {
    const pecas = cacheLooksNaPagina[climaId];
    if(!pecas || pecas.length === 0) return;

    try {
        for(let peca of pecas) {
            await fetch('/usar/' + peca.id);
        }
        if (typeof mostrarToast === "function") {
            mostrarToast("A combinação foi adicionada ao seu Histórico de Uso! 👕", "sucesso");
        } else {
            alert("A combinação foi marcada como usada!");
        }
    } catch (e) {
        console.error("Erro ao registrar uso de peças:", e);
    }
}
</script>

{% endblock %}
